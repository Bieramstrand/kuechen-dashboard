<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Küchen Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #E4DCC5;
      font-family: 'Inter', sans-serif;
      color: #2E2A22;
      overflow: hidden;
      padding: 0;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
      gap: 12px;
      padding: 12px;
    }
    .panel {
      background: #FBF8F1;
      border-radius: 12px;
      border: 1px solid #E4DCC5;
      box-shadow: 0 2px 8px rgba(46,42,34,0.1);
      padding: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel-title {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0 0 12px;
      color: #2E2A22;
    }
    .panel-subtitle {
      font-size: 0.85rem;
      color: #8A8069;
      margin: 0 0 10px;
    }

    /* Kalender Panel */
    #calendarPanel {
      grid-column: 1;
      grid-row: 1 / 3;
    }
    .calendar-month {
      text-align: center;
      margin-bottom: 12px;
    }
    .calendar-month-label {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }
    .calendar-dow {
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: #8A8069;
      padding: 4px 0;
    }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #F1ECDD;
      font-size: 0.95rem;
      font-weight: 500;
      position: relative;
      min-height: 35px;
    }
    .calendar-day.today {
      background: #3C6E8F;
      color: #FBF8F1;
      font-weight: 700;
    }
    .calendar-day.other-month {
      color: #C9BF9F;
    }
    .calendar-day.has-event {
      border: 2px solid #D9A441;
      font-weight: 700;
    }
    .calendar-events {
      font-size: 0.75rem;
      line-height: 1.2;
      max-height: 120px;
      overflow-y: auto;
    }
    .calendar-event {
      background: #F1ECDD;
      border-left: 3px solid #3C6E8F;
      padding: 6px 8px;
      margin: 4px 0;
      border-radius: 3px;
      font-size: 0.8rem;
    }
    .calendar-event.moss { border-left-color: #4F6B44; }
    .calendar-event.ocean { border-left-color: #3C6E8F; }

    /* Wetter/Radar Panel */
    #weatherPanel {
      grid-column: 2;
      grid-row: 1;
    }
    .radar-container {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #f0f0f0;
    }
    .radar-embed {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* RainViewer Timeline */
    .radar-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .time-btn {
      background: #F1ECDD;
      border: 1px solid #E4DCC5;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: #2E2A22;
      transition: all 0.2s ease;
    }
    .time-btn:active {
      background: #3C6E8F;
      color: #FBF8F1;
      border-color: #3C6E8F;
    }
    .time-btn.active {
      background: #3C6E8F;
      color: #FBF8F1;
      border-color: #3C6E8F;
    }
    .current-time {
      font-size: 0.8rem;
      color: #8A8069;
      text-align: center;
      margin-top: 4px;
    }

    /* HVV Panel */
    #hvvPanel {
      grid-column: 3;
      grid-row: 1;
    }
    .hvv-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hvv-item {
      background: #F1ECDD;
      border-radius: 8px;
      padding: 12px;
      border-left: 5px solid #3C6E8F;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hvv-line {
      font-weight: 700;
      font-size: 1.2rem;
      color: #2E2A22;
    }
    .hvv-destination {
      font-size: 0.9rem;
      color: #5B5340;
      margin: 2px 0;
    }
    .hvv-time {
      font-size: 1.1rem;
      font-weight: 600;
      color: #3C6E8F;
    }
    .hvv-delay {
      font-size: 0.8rem;
      color: #B5533C;
      margin-top: 4px;
    }
    .hvv-loading {
      text-align: center;
      color: #8A8069;
      padding: 20px;
    }
    .hvv-error {
      background: #FFE5E0;
      color: #B5533C;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* Nächste Aktionen Panel */
    #actionsPanel {
      grid-column: 2 / 4;
      grid-row: 2;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      flex: 1;
    }
    .action-card {
      background: #F1ECDD;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .action-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: #2E2A22;
    }
    .action-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #3C6E8F;
      cursor: pointer;
      user-select: none;
    }
    .action-card.moss { border-left: 5px solid #4F6B44; }
    .action-card.moss .action-value { color: #4F6B44; }
    .action-card.ocean { border-left: 5px solid #3C6E8F; }
    .action-card.ocean .action-value { color: #3C6E8F; }

    .last-update {
      font-size: 0.7rem;
      color: #C9BF9F;
      text-align: right;
      margin-top: 8px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #C9BF9F;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Kalender -->
    <div class="panel" id="calendarPanel">
      <h2 class="panel-title">Kalender</h2>
      <div class="calendar-month">
        <p class="calendar-month-label" id="monthLabel">Januar 2025</p>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="calendar-events" id="calendarEvents"></div>
      <div class="last-update" id="calendarUpdate"></div>
    </div>

    <!-- Wetter/Radar -->
    <div class="panel" id="weatherPanel">
      <h2 class="panel-title">Regen Radar</h2>
      <p class="panel-subtitle">Norderstedt – Nächste 2 Stunden Vorhersage</p>
      <div class="radar-controls" id="timelineControls">
        <button class="time-btn active" data-offset="0">Jetzt</button>
        <button class="time-btn" data-offset="30">+30 Min</button>
        <button class="time-btn" data-offset="60">+60 Min</button>
        <button class="time-btn" data-offset="90">+90 Min</button>
      </div>
      <div class="current-time" id="currentTimeDisplay"></div>
      <div class="radar-container">
        <div id="rainviewer-map" style="width: 100%; height: 100%;"></div>
      </div>
    </div>

    <!-- HVV -->
    <div class="panel" id="hvvPanel">
      <h2 class="panel-title">U-Bahn Garstedt</h2>
      <p class="panel-subtitle">Richtung Ohlsdorf – Nächste Abfahrten</p>
      <div class="hvv-list" id="hvvList">
        <div class="hvv-loading">Wird geladen…</div>
      </div>
      <div class="last-update" id="hvvUpdate"></div>
    </div>

    <!-- Nächste Aktionen -->
    <div class="panel" id="actionsPanel">
      <h2 class="panel-title">Übersicht diese Woche</h2>
      <div class="actions-grid">
        <div class="action-card ocean">
          <span class="action-title">Einkaufsliste</span>
          <span class="action-value" id="shoppingCount">0</span>
        </div>
        <div class="action-card moss">
          <span class="action-title">Haushalt Tasks</span>
          <span class="action-value" id="householdTasks">0/0</span>
        </div>
        <div class="action-card ocean">
          <span class="action-title">Was essen wir heute</span>
          <span class="action-value" id="todaysMeal">—</span>
        </div>
      </div>
    </div>
  </div>

<script>
  const HAFAS_BASE = 'https://v5.bvg.transport.rest';
  
  // RainViewer Karte initialisieren
  function initRainViewer() {
    const map = L.map('rainviewer-map').setView([53.633, 10.000], 11);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 18
    }).addTo(map);

    const RainViewerApiKey = '5ec59eb0ff9a9b000b8e7a3b';
    
    let rainLayer = null;
    let timestamps = [];
    let selectedOffset = 0;

    function loadRainViewerData() {
      fetch(`https://api.rainviewer.com/public/weather-maps-api-free.json?key=${RainViewerApiKey}`)
        .then(res => res.json())
        .then(data => {
          timestamps = data.radar.nowcast || [];
          if (timestamps.length > 0) {
            updateRainLayer(selectedOffset);
          }
        })
        .catch(e => console.error('RainViewer load error:', e));
    }

    function updateRainLayer(offsetMinutes) {
      if (rainLayer) map.removeLayer(rainLayer);
      
      const now = new Date();
      const targetTime = new Date(now.getTime() + offsetMinutes * 60000);
      const targetTimestamp = Math.floor(targetTime.getTime() / 1000);
      
      // Finde den nächsten verfügbaren Zeitstempel
      let closest = timestamps[0];
      for (let ts of timestamps) {
        if (Math.abs(ts[0] - targetTimestamp) < Math.abs(closest[0] - targetTimestamp)) {
          closest = ts;
        }
      }
      
      if (closest) {
        const url = `https://tilecache.rainviewer.com/v2/radar/${closest[0]}/512/{z}/{x}/{y}/2/1_1.png`;
        rainLayer = L.tileLayer(url, {
          tms: false,
          opacity: 0.7,
          maxZoom: 18
        }).addTo(map);
        
        // Zeit anzeigen
        const displayTime = new Date(closest[0] * 1000);
        const timeStr = displayTime.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('currentTimeDisplay').textContent = timeStr + ' Uhr';
      }
    }

    // Button-Handler
    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        selectedOffset = parseInt(e.target.dataset.offset);
        updateRainLayer(selectedOffset);
      });
    });

    loadRainViewerData();
    setInterval(loadRainViewerData, 5 * 60 * 1000);
  }

  // Kalender aus Speicher laden
  async function loadCalendarEvents() {
    let events = [];
    try {
      const trips = await window.storage.get('household:trips', true);
      if (trips) {
        const tripsData = JSON.parse(trips.value);
        events = tripsData.map(t => ({
          date: new Date(t.start),
          title: t.destination,
          category: 'ocean'
        }));
      }
    } catch (e) {}
    return events;
  }

  // Kalender rendern
  async function renderCalendar() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    
    const monthName = new Date(year, month, 1).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    document.getElementById('monthLabel').textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);
    
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startingDayOfWeek = firstDay.getDay();
    
    const events = await loadCalendarEvents();
    const eventsByDate = {};
    events.forEach(e => {
      const key = e.date.toISOString().split('T')[0];
      if (!eventsByDate[key]) eventsByDate[key] = [];
      eventsByDate[key].push(e);
    });
    
    const grid = document.getElementById('calendarGrid');
    const eventsDiv = document.getElementById('calendarEvents');
    grid.innerHTML = '';
    
    const daysOfWeek = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
    daysOfWeek.forEach(day => {
      const dow = document.createElement('div');
      dow.className = 'calendar-dow';
      dow.textContent = day;
      grid.appendChild(dow);
    });
    
    for (let i = 0; i < startingDayOfWeek; i++) {
      const day = document.createElement('div');
      day.className = 'calendar-day other-month';
      grid.appendChild(day);
    }
    
    for (let day = 1; day <= daysInMonth; day++) {
      const dayEl = document.createElement('div');
      dayEl.className = 'calendar-day';
      
      const currentDate = new Date(year, month, day);
      const dateStr = currentDate.toISOString().split('T')[0];
      const isToday = dateStr === now.toISOString().split('T')[0];
      
      if (isToday) dayEl.classList.add('today');
      if (eventsByDate[dateStr]) dayEl.classList.add('has-event');
      
      dayEl.textContent = day;
      grid.appendChild(dayEl);
    }
    
    eventsDiv.innerHTML = '';
    const nextEvent = events.find(e => e.date >= now);
    if (nextEvent) {
      const ev = document.createElement('div');
      ev.className = `calendar-event ${nextEvent.category}`;
      ev.textContent = `${nextEvent.date.toLocaleDateString('de-DE')}: ${nextEvent.title}`;
      eventsDiv.appendChild(ev);
    }
    
    const now2 = new Date();
    document.getElementById('calendarUpdate').textContent = `Aktualisiert: ${now2.toLocaleTimeString('de-DE')}`;
  }

  // HVV Echtzeitdaten über HAFAS (BVG-API als Fallback für Hamburg)
  // HVV Daten von Netlify Function laden
  async function loadHVVData() {
    const listEl = document.getElementById('hvvList');
    try {
      const response = await fetch('/.netlify/functions/hvv-departures');
      if (!response.ok) throw new Error('Function error');
      
      const data = await response.json();
      
      if (!data.success || !data.departures || data.departures.length === 0) {
        listEl.innerHTML = '<div class="hvv-error">Keine U1-Abfahrten verfügbar</div>';
        return;
      }
      
      listEl.innerHTML = data.departures.map(dep => `
        <div class="hvv-item">
          <div class="hvv-line">U 1</div>
          <div class="hvv-destination">${dep.destination}</div>
          <div class="hvv-time">${dep.time} (${dep.minToDepart} min)</div>
          ${dep.delay > 0 ? `<div class="hvv-delay">Verspätung: +${dep.delay} min</div>` : ''}
        </div>
      `).join('');
    } catch (e) {
      console.error('HVV fetch error:', e);
      listEl.innerHTML = `<div class="hvv-error">HVV-Daten nicht erreichbar</div>`;
    }
    
    const now = new Date();
    document.getElementById('hvvUpdate').textContent = `Aktualisiert: ${now.toLocaleTimeString('de-DE')}`;
  }

  // Aktions-Übersicht aktualisieren
  async function updateActionsOverview() {
    try {
      // Einkaufsliste
      const shopping = await window.storage.get('household:shopping', true);
      if (shopping) {
        const shopData = JSON.parse(shopping.value);
        const openCount = shopData.filter(i => !i.done).length;
        document.getElementById('shoppingCount').textContent = openCount;
      } else {
        document.getElementById('shoppingCount').textContent = '0';
      }
      
      // Was essen wir heute
      const mealData = await window.storage.get('household:todays-meal', true);
      if (mealData) {
        const meal = JSON.parse(mealData.value);
        const today = new Date().toISOString().split('T')[0];
        if (meal.date === today) {
          document.getElementById('todaysMeal').textContent = meal.text || '—';
        } else {
          document.getElementById('todaysMeal').textContent = '—';
        }
      } else {
        document.getElementById('todaysMeal').textContent = '—';
      }
      
      // Haushalt Tasks
      const tasks = await window.storage.get('household:tasks', true);
      if (tasks) {
        const tasksData = JSON.parse(tasks.value);
        const today = new Date().toISOString().split('T')[0];
        const todaysTasks = tasksData.filter(t => t.date === today);
        const completed = todaysTasks.filter(t => t.done).length;
        const total = todaysTasks.length;
        document.getElementById('householdTasks').textContent = completed + '/' + total;
      } else {
        document.getElementById('householdTasks').textContent = '0/0';
      }
      
    } catch (e) {
      console.error('Actions update error:', e);
    }
  }

  // Click Handler für Meal, Tasks und HVV
  document.addEventListener('click', async (e) => {
    if (e.target.id === 'todaysMeal') {
      const input = prompt('Was essen wir heute?');
      if (input !== null) {
        const today = new Date().toISOString().split('T')[0];
        await window.storage.set('household:todays-meal', JSON.stringify({ date: today, text: input }), true);
        document.getElementById('todaysMeal').textContent = input || '—';
      }
    }
    
    if (e.target.id === 'householdTasks') {
      const taskInput = prompt('Neue Task für heute (z.B. "Küche putzen, Wäsche waschen")');
      if (taskInput !== null && taskInput.trim()) {
        const today = new Date().toISOString().split('T')[0];
        let tasksData = [];
        try {
          const existing = await window.storage.get('household:tasks', true);
          if (existing) tasksData = JSON.parse(existing.value);
        } catch (e) {}
        
        tasksData.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          date: today,
          text: taskInput.trim(),
          done: false
        });
        
        await window.storage.set('household:tasks', JSON.stringify(tasksData), true);
        await updateActionsOverview();
      }
    }
  });

  // Initialisierung
  (async function init() {
    initRainViewer();
    await renderCalendar();
    await loadHVVData();
    await updateActionsOverview();
    
    // Auto-refresh alle 5 Minuten
    setInterval(async () => {
      await renderCalendar();
      await loadHVVData();
      await updateActionsOverview();
    }, 5 * 60 * 1000);
  })();
</script>
</body>
</html>
