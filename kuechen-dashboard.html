  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #E4DCC5;
      font-family: 'Inter', sans-serif;
      color: #2E2A22;
      overflow: hidden;
      padding: 0;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
      gap: 12px;
      padding: max(28px, env(safe-area-inset-top)) 12px 12px 12px;
    }
    .panel {
      background: #FBF8F1;
      border-radius: 12px;
      border: 1px solid #E4DCC5;
      box-shadow: 0 2px 8px rgba(46,42,34,0.1);
      padding: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel-title {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0 0 12px;
      color: #2E2A22;
    }
    .panel-subtitle {
      font-size: 0.85rem;
      color: #8A8069;
      margin: 0 0 10px;
    }

    /* Kalender Panel */
    #calendarPanel {
      grid-column: 1;
      grid-row: 1 / 3;
    }
    .calendar-month {
      text-align: center;
      margin-bottom: 12px;
    }
    .calendar-month-label {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }
    .calendar-dow {
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: #8A8069;
      padding: 4px 0;
    }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #F1ECDD;
      font-size: 0.95rem;
      font-weight: 500;
      position: relative;
      min-height: 35px;
    }
    .calendar-day.today {
      background: #3C6E8F;
      color: #FBF8F1;
      font-weight: 700;
    }
    .calendar-day.other-month {
      color: #C9BF9F;
    }
    .calendar-day.has-event {
      border: 2px solid #D9A441;
      font-weight: 700;
    }
    .calendar-day.selected {
      background: #D9A441;
      color: #2E2A22;
      font-weight: 700;
      box-shadow: 0 0 0 2px #3C6E8F inset;
    }
    .calendar-events {
      font-size: 0.75rem;
      line-height: 1.2;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    .calendar-event {
      background: #F1ECDD;
      border-left: 3px solid #3C6E8F;
      padding: 6px 8px;
      margin: 4px 0;
      border-radius: 3px;
      font-size: 0.8rem;
    }
    .calendar-event.moss { border-left-color: #4F6B44; }
    .calendar-event.ocean { border-left-color: #3C6E8F; }

    /* Wetter/Radar Panel */
    #weatherPanel {
      grid-column: 2;
      grid-row: 1;
    }
    .radar-container {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
    }
    .radar-recenter-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 1000;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #FBF8F1;
      color: #3C6E8F;
      font-size: 1.1rem;
      box-shadow: 0 2px 6px rgba(42,36,23,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radar-recenter-btn:active {
      background: #E4DCC5;
    }
    .refresh-fab {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 2000;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #3C6E8F;
      color: #FBF8F1;
      font-size: 1.3rem;
      box-shadow: 0 3px 10px rgba(42,36,23,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .refresh-fab:active {
      background: #2E5A75;
      transform: scale(0.95);
    }
    .refresh-fab.spinning {
      animation: refresh-spin 0.6s linear;
    }
    @keyframes refresh-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .home-marker-inner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #3C6E8F;
      border: 3px solid #FBF8F1;
      box-shadow: 0 1px 5px rgba(42,36,23,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .radar-embed {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* RainViewer Timeline */
    .radar-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .time-btn {
      background: #F1ECDD;
      border: 1px solid #E4DCC5;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: #2E2A22;
      transition: all 0.2s ease;
    }
    .time-btn:active {
      background: #3C6E8F;
      color: #FBF8F1;
      border-color: #3C6E8F;
    }
    .time-btn.active {
      background: #3C6E8F;
      color: #FBF8F1;
      border-color: #3C6E8F;
    }
    .radar-timeline {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .radar-play-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #3C6E8F;
      color: #FBF8F1;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radar-play-btn:active { background: #2E5A75; }
    .radar-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #E4DCC5;
      outline: none;
    }
    .radar-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #D9A441;
      border: 3px solid #FBF8F1;
      box-shadow: 0 1px 4px rgba(42,36,23,0.3);
      cursor: pointer;
    }
    .radar-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #D9A441;
      border: 3px solid #FBF8F1;
      cursor: pointer;
    }
    .current-time {
      font-size: 0.8rem;
      color: #8A8069;
      text-align: center;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .radar-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
      letter-spacing: 0.03em;
    }
    .radar-badge.badge-past { background: #8A8069; color: #FBF8F1; }
    .radar-badge.badge-future { background: #D9A441; color: #2E2A22; }

    /* HVV Panel */
    #hvvPanel {
      grid-column: 3;
      grid-row: 1;
    }
    .hvv-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hvv-item {
      background: #F1ECDD;
      border-radius: 8px;
      padding: 12px;
      border-left: 5px solid #3C6E8F;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hvv-line {
      font-weight: 700;
      font-size: 1.2rem;
      color: #2E2A22;
    }
    .hvv-destination {
      font-size: 0.9rem;
      color: #5B5340;
      margin: 2px 0;
    }
    .hvv-time {
      font-size: 1.1rem;
      font-weight: 600;
      color: #3C6E8F;
    }
    .hvv-delay {
      font-size: 0.8rem;
      color: #B5533C;
      margin-top: 4px;
    }
    .hvv-loading {
      text-align: center;
      color: #8A8069;
      padding: 20px;
    }
    .hvv-error {
      background: #FFE5E0;
      color: #B5533C;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* Nächste Aktionen Panel */
    #actionsPanel {
      grid-column: 2 / 4;
      grid-row: 2;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      flex: 1;
    }
    .action-card {
      background: #F1ECDD;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .action-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: #2E2A22;
    }
    .action-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #3C6E8F;
      cursor: pointer;
      user-select: none;
      margin-top: 2px;
    }
    .action-card.moss { border-left: 5px solid #4F6B44; }
    .action-card.moss .action-value { color: #4F6B44; }
    .action-card.ocean { border-left: 5px solid #3C6E8F; }
    .action-card.ocean .action-value { color: #3C6E8F; }

    .shopping-preview {
      margin-top: 6px;
      font-size: 0.75rem;
      color: #5B5340;
      line-height: 1.5;
    }
    .shopping-preview .more {
      color: #8A8069;
      font-style: italic;
    }


    .last-update {
      font-size: 0.7rem;
      color: #C9BF9F;
      text-align: right;
      margin-top: 8px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #C9BF9F;
      border-radius: 3px;
    }

    /* Eigenes Eingabefenster statt Browser-prompt() */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(42, 36, 23, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-card {
      background: #FBF8F1;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 40px rgba(42,36,23,0.35);
      border: 1px solid #E4DCC5;
    }
    .modal-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.3rem;
      color: #2E2A22;
      margin: 0 0 6px;
    }
    .modal-hint {
      font-size: 0.8rem;
      color: #8A8069;
      margin: 0 0 14px;
    }
    .modal-input {
      width: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      padding: 12px 14px;
      border: 1.5px solid #E4DCC5;
      border-radius: 8px;
      background: #FFFFFF;
      color: #2E2A22;
      outline: none;
      box-sizing: border-box;
    }
    .modal-input:focus { border-color: #3C6E8F; }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .modal-btn {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .modal-btn.cancel {
      background: transparent;
      color: #8A8069;
    }
    .modal-btn.ok {
      background: #3C6E8F;
      color: #FBF8F1;
    }
    .modal-btn.ok:active { background: #2E5A75; }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Kalender -->
    <div class="panel" id="calendarPanel">
      <h2 class="panel-title">Kalender</h2>
      <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
        <div style="flex: 1;">
          <p class="calendar-month-label" id="monthLabel">Januar 2025</p>
        </div>
        <label style="background: #3C6E8F; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer; white-space: nowrap;">
          📅 ICS laden
          <input type="file" id="icsUpload" accept=".ics" style="display: none;" />
        </label>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="calendar-events" id="calendarEvents"></div>
      <div class="last-update" id="calendarUpdate"></div>
    </div>

    <!-- Wetter/Radar -->
    <div class="panel" id="weatherPanel">
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">
        <h2 class="panel-title" style="margin-bottom:0;">Regen Radar</h2>
        <div style="text-align:right;">
          <span id="currentTemp" style="font-family:'Fraunces', serif; font-weight:600; font-size:1.6rem; color:#C4883A;"></span>
          <div id="tempDetail" style="font-size:0.7rem; color:#8A8069; margin-top:-2px;"></div>
        </div>
      </div>
      <p class="panel-subtitle">Norderstedt – Regenradar</p>
      <div class="radar-timeline">
        <button id="radarPlayBtn" class="radar-play-btn" aria-label="Abspielen">▶</button>
        <input type="range" id="radarSlider" class="radar-slider" min="0" max="0" value="0" step="1" />
      </div>
      <div class="current-time" id="currentTimeDisplay">
        <span id="radarTimeBadge" class="radar-badge badge-past">Echtzeit</span>
      </div>
      <div class="radar-container">
        <div id="rainviewer-map" style="width: 100%; height: 100%;"></div>
        <button id="radarRecenterBtn" class="radar-recenter-btn" aria-label="Zurück zu Norderstedt" title="Zurück zu Norderstedt">📍</button>
      </div>
    </div>

    <!-- HVV -->
    <div class="panel" id="hvvPanel">
      <h2 class="panel-title">U-Bahn Garstedt</h2>
      <p class="panel-subtitle" id="hvvSubtitle">Richtung Innenstadt – Nächste Abfahrten</p>
      <div class="radar-controls" id="hvvDirectionControls">
        <button class="time-btn active" data-direction="innenstadt">🏙️ Innenstadt / Hbf</button>
        <button class="time-btn" data-direction="poppenbuettel">🚉 Poppenbüttel</button>
      </div>
      <div class="hvv-list" id="hvvList">
        <div class="hvv-loading">Wird geladen…</div>
      </div>
      <div class="last-update" id="hvvUpdate"></div>
    </div>

    <!-- Nächste Aktionen -->
    <div class="panel" id="actionsPanel">
      <h2 class="panel-title">Übersicht diese Woche</h2>
      <div class="actions-grid">
        <div class="action-card ocean" id="shoppingCard" style="cursor:pointer;">
          <span class="action-title" style="display:flex; align-items:center; gap:6px;">
            <a href="https://homedashboardeinkaufszettel.netlify.app" target="_blank" rel="noopener"

            </a>
            Einkaufsliste
          </span>
          <span class="action-value" id="shoppingCount">0</span>
          <div id="shoppingPreview" class="shopping-preview"></div>
        </div>
        <div class="action-card moss" id="pinnwandCard" style="cursor:pointer;">
          <span class="action-title" style="display:flex; align-items:center; gap:6px;">

  // Firebase Setup – ersetzt window.storage 1:1, damit der Rest des Codes unverändert bleibt
  const firebaseConfig = {
    apiKey: "AIzaSyBFbKIBKr0gr621e8XSljAG4lGXOSrIxwo",
    authDomain: "homedashboard-8d951.firebaseapp.com",
    projectId: "homedashboard-8d951",
    storageBucket: "homedashboard-8d951.firebasestorage.app",
    messagingSenderId: "443725141758",
    appId: "1:443725141758:web:64331ff8100f27acd037af"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = 'household';

  window.storage = {
    async get(key, shared) {
      const snap = await db.collection(COLLECTION).doc(key).get();
      if (!snap.exists) return null;
      let value = snap.data().value;
      // Absicherung: falls die Daten als natives Firestore-Array/Objekt statt als
      // JSON-String vorliegen (kann durch aeltere Schreibvorgaenge passieren),
      // hier auf einen String normalisieren, damit JSON.parse() ueberall funktioniert.
      if (value !== null && typeof value !== 'string') { value = JSON.stringify(value); }
      return { key, value, shared: !!shared };
    },
    async set(key, value, shared) {
      await db.collection(COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      await db.collection(COLLECTION).doc(key).delete();
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const snap = await db.collection(COLLECTION).get();
      const keys = [];
      snap.forEach((d) => {
        if (!prefix || d.id.startsWith(prefix)) keys.push(d.id);
      });
      return { keys, prefix, shared: !!shared };
    },
  };

<script>
  const HAFAS_BASE = 'https://v5.bvg.transport.rest';

  // Eigenes Eingabefenster statt Browser-prompt() – gleiche Nutzung: await customPrompt(titel, hinweis)
  function customPrompt(title, hint) {
    return new Promise((resolve) => {
      const overlay = document.getElementById('modalOverlay');
      const input = document.getElementById('modalInput');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalHint').textContent = hint || '';
      input.value = '';
      overlay.classList.remove('hidden');
      setTimeout(() => input.focus(), 50);

      function cleanup(result) {
        overlay.classList.add('hidden');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        input.removeEventListener('keydown', onKeydown);
        resolve(result);
      }
      const okBtn = document.getElementById('modalOkBtn');
      const cancelBtn = document.getElementById('modalCancelBtn');
      function onOk() { cleanup(input.value); }
      function onCancel() { cleanup(null); }
      function onKeydown(e) {
        if (e.key === 'Enter') onOk();
        if (e.key === 'Escape') onCancel();
      }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      input.addEventListener('keydown', onKeydown);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Liefert TT-MM-JJJJ als lokales Datum (NICHT über toISOString, das würde wegen
  // Zeitzone/Sommerzeit auf den falschen Tag verschieben können)
  function localDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // Zeigt "HH:MM Titel" bei Terminen mit echter Uhrzeit, sonst nur den Titel
  // (ganztägige ICS-Termine ohne Uhrzeit landen technisch auf 00:00 Uhr - das ist keine echte Zeit)
  function formatEventText(ev) {
    const h = ev.date.getHours();
    const m = ev.date.getMinutes();
    if (h === 0 && m === 0) return ev.title;
    const time = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    return `${time} ${ev.title}`;
  }
  
  // Aktuelle Temperatur, gefühlte Temperatur und Tageshöchstwert für Norderstedt (Open-Meteo, kostenlos, kein Key nötig)
  async function loadTemperature() {
    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.683943&longitude=9.979259&current=temperature_2m,apparent_temperature&daily=temperature_2m_max&timezone=Europe%2FBerlin');
      const data = await res.json();
      const temp = data.current && data.current.temperature_2m;
      const feelsLike = data.current && data.current.apparent_temperature;
      const maxTemp = data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_max[0];

      if (temp != null) {
        document.getElementById('currentTemp').textContent = `${Math.round(temp)}°C`;
      }
      const detailEl = document.getElementById('tempDetail');
      if (detailEl) {
        const parts = [];
        if (feelsLike != null) parts.push(`gefühlt ${Math.round(feelsLike)}°C`);
        if (maxTemp != null) parts.push(`Max. ${Math.round(maxTemp)}°C`);
        detailEl.textContent = parts.join(' · ');
      }
    } catch (e) {
      console.error('Temperatur-Fetch fehlgeschlagen:', e);
    }
  }

  // RainViewer Karte initialisieren
  function initRainViewer() {
    const HOME_VIEW = { center: [53.683943, 9.979259], zoom: 13 }; // Achternfelde 22D, Norderstedt
    const map = L.map('rainviewer-map').setView(HOME_VIEW.center, HOME_VIEW.zoom);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 18
    }).addTo(map);

    // Zuhause-Marker (eigenes Haus-Symbol statt Standard-Pin)
    const homeIcon = L.divIcon({
      className: 'home-marker',
      html: '<div class="home-marker-inner">🏠</div>',
      iconSize: [34, 34],
      iconAnchor: [17, 17],
    });
    L.marker(HOME_VIEW.center, { icon: homeIcon, zIndexOffset: 1000 })
      .addTo(map)
      .bindPopup('Zuhause');

    document.getElementById('radarRecenterBtn').addEventListener('click', () => {
      map.setView(HOME_VIEW.center, HOME_VIEW.zoom);
    });

    let rainLayer = null;
    let frames = []; // RainViewer-Frames, { time, path }
    let tileHost = 'https://tilecache.rainviewer.com';
    let playing = false;
    let playTimer = null;
    let playCount = 0;

    const playBtn = document.getElementById('radarPlayBtn');
    const slider = document.getElementById('radarSlider');
    const badge = document.getElementById('radarTimeBadge');

    // Zeitstrahl: 2 Stunden Vergangenheit (24x5min) + 2 Stunden Zukunft-Platzhalter (24x5min)
    // RainViewer (kostenlos) liefert keine echte Vorhersage, siehe showStep()
    let timeSteps = [];
    let nowStepIndex = 0;

    function generateTimeSteps() {
      const steps = [];
      const now = new Date();
      now.setSeconds(0, 0);
      now.setMinutes(Math.floor(now.getMinutes() / 5) * 5);

      for (let i = -24; i <= 0; i++) {
        steps.push({ time: new Date(now.getTime() + i * 5 * 60000), type: 'past' });
      }
      for (let i = 1; i <= 24; i++) {
        steps.push({ time: new Date(now.getTime() + i * 5 * 60000), type: 'future' });
      }
      return steps;
    }

    function showStep(index) {
      const step = timeSteps[index];
      if (!step) return;
      slider.value = index;
      if (rainLayer) map.removeLayer(rainLayer);

      if (step.type === 'future' || frames.length === 0) {
        // Keine echte Vorhersage verfuegbar - letztes bekanntes Bild zeigen, ehrlich gekennzeichnet
        updateTimeUI(step, frames.length > 0 ? '(keine Vorhersage verfügbar, letzter Stand)' : '(lädt…)');
        if (frames.length > 0) {
          const f = frames[frames.length - 1];
          const url = `${tileHost}${f.path}/512/{z}/{x}/{y}/2/1_1.png`;
          rainLayer = L.tileLayer(url, { tms: false, opacity: 0.7, maxZoom: 18, maxNativeZoom: 7 }).addTo(map);
        }
        return;
      }

      const targetTimestamp = Math.floor(step.time.getTime() / 1000);
      let closestIdx = 0, closestDiff = Infinity;
      frames.forEach((f, i) => {
        const diff = Math.abs(f.time - targetTimestamp);
        if (diff < closestDiff) { closestDiff = diff; closestIdx = i; }
      });
      const f = frames[closestIdx];
      if (f) {
        const url = `${tileHost}${f.path}/512/{z}/{x}/{y}/2/1_1.png`;
        rainLayer = L.tileLayer(url, { tms: false, opacity: 0.7, maxZoom: 18, maxNativeZoom: 7 }).addTo(map);
      }
      updateTimeUI(step, '(RainViewer)');
    }

    function updateTimeUI(step, sourceLabel) {
      const timeStr = step.time.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      if (step.type === 'future') {
        badge.textContent = 'Prognose';
        badge.className = 'radar-badge badge-future';
      } else {
        badge.textContent = 'Echtzeit';
        badge.className = 'radar-badge badge-past';
      }
      let timeSpan = document.getElementById('radarTimeText');
      if (!timeSpan) {
        timeSpan = document.createElement('span');
        timeSpan.id = 'radarTimeText';
        document.getElementById('currentTimeDisplay').prepend(timeSpan);
      }
      timeSpan.textContent = timeStr + ' Uhr ' + sourceLabel;
    }

    function loadRainViewerData(callback) {
      fetch('https://api.rainviewer.com/public/weather-maps.json')
        .then(res => res.json())
        .then(data => {
          tileHost = data.host || tileHost;
          frames = (data.radar && data.radar.past) || [];
          if (callback) callback();
        })
        .catch(e => console.error('RainViewer Ladefehler:', e));
    }

    slider.addEventListener('input', (e) => {
      stopPlaying();
      showStep(parseInt(e.target.value, 10));
    });

    function stepFrame() {
      playCount++;
      if (playCount >= timeSteps.length * 2) {
        stopPlaying();
        showStep(nowStepIndex);
        return;
      }
      let next = parseInt(slider.value, 10) + 1;
      if (next > timeSteps.length - 1) next = 0;
      showStep(next);
    }

    function startPlaying() {
      playing = true;
      playCount = 0;
      playBtn.textContent = '⏸';
      playTimer = setInterval(stepFrame, 600);
    }
    function stopPlaying() {
      playing = false;
      playBtn.textContent = '▶';
      if (playTimer) { clearInterval(playTimer); playTimer = null; }
    }
    playBtn.addEventListener('click', () => {
      if (playing) stopPlaying(); else startPlaying();
    });

    function init() {
      timeSteps = generateTimeSteps();
      slider.max = timeSteps.length - 1;
      nowStepIndex = 24; // Uebergang Vergangenheit/Zukunft
      loadRainViewerData(() => showStep(nowStepIndex));
    }

    init();
    setInterval(init, 5 * 60 * 1000);
  }

  // Einfacher ICS Parser
  function parseICS(icsText) {
    // Zeilenumbrüche normalisieren
    const rawLines = icsText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

    // Gefaltete Zeilen zusammenführen (Fortsetzungszeilen beginnen mit Leerzeichen/Tab)
    const lines = [];
    rawLines.forEach((line) => {
      if ((line.startsWith(' ') || line.startsWith('\t')) && lines.length > 0) {
        lines[lines.length - 1] += line.substring(1);
      } else {
        lines.push(line);
      }
    });

    const events = [];
    let event = null;

    for (let rawLine of lines) {
      const line = rawLine.trim();
      if (!line) continue;

      if (line === 'BEGIN:VEVENT') {
        event = {};
        continue;
      }
      if (line === 'END:VEVENT') {
        if (event && (event.dtstart || event.summary)) events.push(event);
        event = null;
        continue;
      }
      if (!event) continue;

      const colonIdx = line.indexOf(':');
      if (colonIdx === -1) continue;

      const keyPart = line.substring(0, colonIdx); // z.B. DTSTART;TZID=Europe/Berlin
      const value = line.substring(colonIdx + 1);
      const key = keyPart.split(';')[0].toUpperCase();

      if (key === 'DTSTART') {
        event.dtstart = parseICSDate(value);
      } else if (key === 'DTEND') {
        event.dtend = parseICSDate(value);
      } else if (key === 'SUMMARY') {
        event.summary = value.replace(/\\,/g, ',').replace(/\\n/gi, ' ').replace(/\\\\/g, '\\');
      } else if (key === 'RRULE') {
        event.rrule = value;
      } else if (key === 'EXDATE') {
        // Kann mehrere kommagetrennte Daten enthalten
        const exList = value.split(',').map((v) => parseICSDate(v.trim()));
        event.exdates = (event.exdates || []).concat(exList);
      }
    }

    return events.filter((e) => e.dtstart instanceof Date && !isNaN(e.dtstart));
  }

  function parseICSDate(value) {
    const isUTC = value.endsWith('Z');
    const clean = value.replace('Z', '');
    const year = parseInt(clean.substring(0, 4), 10);
    const month = parseInt(clean.substring(4, 6), 10) - 1;
    const day = parseInt(clean.substring(6, 8), 10);

    if (clean.length > 8 && clean[8] === 'T') {
      const hour = parseInt(clean.substring(9, 11), 10) || 0;
      const min = parseInt(clean.substring(11, 13), 10) || 0;
      const sec = parseInt(clean.substring(13, 15), 10) || 0;
      return isUTC
        ? new Date(Date.UTC(year, month, day, hour, min, sec))
        : new Date(year, month, day, hour, min, sec);
    }
    return new Date(year, month, day);
  }

  function parseRRuleString(rrule) {
    const parts = {};
    rrule.split(';').forEach((p) => {
      const [k, v] = p.split('=');
      if (k) parts[k.toUpperCase()] = v;
    });
    return parts;
  }

  function addDays(date, n) {
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }
  function addMonths(date, n) {
    const d = new Date(date);
    d.setMonth(d.getMonth() + n);
    return d;
  }
  function addYears(date, n) {
    const d = new Date(date);
    d.setFullYear(d.getFullYear() + n);
    return d;
  }
  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  // Erweitert ein Event mit RRULE zu einzelnen Terminen innerhalb von [rangeStart, rangeEnd]
  // Unterstützt: FREQ=DAILY/WEEKLY/MONTHLY/YEARLY, INTERVAL, COUNT, UNTIL, EXDATE
  // (BYDAY/BYMONTHDAY werden nicht ausgewertet - reicht für typische Haushalts-Termine wie Mülltonnen, Serientermine)
  function expandRecurrence(event, rangeStart, rangeEnd) {
    if (!event.rrule) {
      // Mehrtägiger Termin (z.B. "Sperrung U1 vom 10.–20.08.") – an jedem Tag im Zeitraum zeigen,
      // nicht nur am Starttag (der könnte längst in der Vergangenheit liegen, während der Termin noch läuft)
      if (event.dtend && (event.dtend - event.dtstart) > 20 * 60 * 60 * 1000) {
        const results = [];
        let d = new Date(event.dtstart.getFullYear(), event.dtstart.getMonth(), event.dtstart.getDate());
        const endDay = new Date(event.dtend.getFullYear(), event.dtend.getMonth(), event.dtend.getDate());
        let iter = 0;
        while (d < endDay && iter < 400) {
          if (d >= rangeStart && d <= rangeEnd) results.push(new Date(d));
          d = addDays(d, 1);
          iter++;
        }
        return results;
      }
      return event.dtstart >= rangeStart && event.dtstart <= rangeEnd ? [event.dtstart] : [];
    }

    const rule = parseRRuleString(event.rrule);
    const freq = rule.FREQ;
    const interval = parseInt(rule.INTERVAL || '1', 10) || 1;
    const count = rule.COUNT ? parseInt(rule.COUNT, 10) : null;
    const until = rule.UNTIL ? parseICSDate(rule.UNTIL) : null;

    const results = [];
    let current = new Date(event.dtstart);
    let n = 0;
    const maxIterations = 1500; // Sicherheitsbremse gegen Endlosschleifen
    let iter = 0;

    while (iter < maxIterations) {
      iter++;
      if (until && current > until) break;
      if (count != null && n >= count) break;
      if (current > rangeEnd) break;

      if (current >= rangeStart && current <= rangeEnd) {
        const excluded = (event.exdates || []).some((ex) => isSameDay(ex, current));
        if (!excluded) results.push(new Date(current));
      }
      n++;

      if (freq === 'DAILY') {
        current = addDays(current, interval);
      } else if (freq === 'WEEKLY') {
        current = addDays(current, 7 * interval);
      } else if (freq === 'MONTHLY') {
        current = addMonths(current, interval);
      } else if (freq === 'YEARLY') {
        current = addYears(current, interval);
      } else {
        break; // unbekannte Frequenz, nicht weiter expandieren
      }
    }

    return results;
  }

  // Alle geparsten Events auf einen Anzeige-Zeitraum expandieren (wiederkehrende Termine einzeln auflösen)
  function expandAllRecurrences(rawEvents) {
    const now = new Date();
    const rangeStart = new Date(now.getFullYear(), now.getMonth(), 1); // Anfang aktueller Monat
    const rangeEnd = addDays(now, 120); // ca. 4 Monate voraus

    const expanded = [];
    rawEvents.forEach((ev) => {
      const occurrences = expandRecurrence(ev, rangeStart, rangeEnd);
      occurrences.forEach((d) => {
        expanded.push({ dtstart: d, summary: ev.summary });
      });
    });
    return expanded;
  }

  // Kalender rendern

  async function renderCalendar() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    
    const monthName = new Date(year, month, 1).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    document.getElementById('monthLabel').textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);
    
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const daysInMonth = lastDay.getDate();
    // Woche beginnt mit Montag: JS getDay() liefert 0=So..6=Sa, hier auf 0=Mo..6=So umrechnen
    const startingDayOfWeek = (firstDay.getDay() + 6) % 7;
    
    const events = await loadCalendarEvents();
    const eventsByDate = {};
    events.forEach(e => {
      const key = localDateKey(e.date);
      if (!eventsByDate[key]) eventsByDate[key] = [];
      eventsByDate[key].push(e);
    });
    
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    
    const daysOfWeek = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    daysOfWeek.forEach(day => {
      const dow = document.createElement('div');
      dow.className = 'calendar-dow';
      dow.textContent = day;
      grid.appendChild(dow);
    });
    
    for (let i = 0; i < startingDayOfWeek; i++) {
      const day = document.createElement('div');
      day.className = 'calendar-day other-month';
      grid.appendChild(day);
    }
    
    for (let day = 1; day <= daysInMonth; day++) {
      const dayEl = document.createElement('div');
      dayEl.className = 'calendar-day';
      
      const currentDate = new Date(year, month, day);
      const dateStr = localDateKey(currentDate);
      const isToday = dateStr === localDateKey(now);
      
      if (isToday) dayEl.classList.add('today');
      if (eventsByDate[dateStr]) dayEl.classList.add('has-event');
      if (calendarSelectedDate === dateStr) dayEl.classList.add('selected');
      
      dayEl.textContent = day;
      dayEl.style.cursor = 'pointer';
      dayEl.addEventListener('click', () => {
        calendarSelectedDate = calendarSelectedDate === dateStr ? null : dateStr; // erneuter Klick hebt Auswahl auf
        document.querySelectorAll('.calendar-day.selected').forEach((el) => el.classList.remove('selected'));
        if (calendarSelectedDate) dayEl.classList.add('selected');
        renderEventsSection(events, eventsByDate);
      });
      grid.appendChild(dayEl);
    }
    
    renderEventsSection(events, eventsByDate);
    
    const updateEl = document.getElementById('calendarUpdate');
    try {
      const importedAt = await window.storage.get('household:calendar-ics-imported-at', true);
      if (importedAt && importedAt.value) {
        const d = new Date(parseInt(importedAt.value, 10));
        updateEl.textContent = `ICS zuletzt geladen: ${d.toLocaleDateString('de-DE')} ${d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}`;
      } else {
        updateEl.textContent = 'Noch keine ICS-Datei geladen';
      }
    } catch (e) {
      updateEl.textContent = 'Noch keine ICS-Datei geladen';
    }
  }

    if (calendarSelectedDate) {

  // Versucht, verschiedene moegliche GTI-Zeitformate zu erkennen (String/ISO/Objekt)
  function parseGtiTime(raw) {
    if (!raw) return null;
    if (typeof raw === 'string') {
      const d = new Date(raw);
      if (!isNaN(d)) return d;
    }
    if (typeof raw === 'object' && raw.date && raw.time) {
      // z.B. { date: "16.08.2026", time: "14:30" }
      const [day, month, year] = String(raw.date).split('.');
      const [h, m] = String(raw.time).split(':');
      if (day && month && year && h && m) {
        return new Date(+year, +month - 1, +day, +h, +m);
      }
    }
    return null;
  }

  async function loadPoppenbuettelRoute() {
    const listEl = document.getElementById('hvvList');
    listEl.innerHTML = '<div class="hvv-loading">Wird geladen…</div>';
    try {
      const response = await fetch('/.netlify/functions/hvv-route?_=' + Date.now(), { cache: 'no-store' });
      const data = await response.json();

      if (!data.success || !data.connections || data.connections.length === 0) {
        listEl.innerHTML = `<div class="hvv-error">Keine Verbindung gefunden${data.error ? ': ' + data.error : ''}</div>`;
        return;
      }

      // Zusaetzliche Absicherung: nur Verbindungen zeigen, deren Abfahrt nicht in der Vergangenheit liegt
      const now = new Date();
      const withDates = data.connections.map((c) => ({ ...c, depDate: parseGtiTime(c.departureRaw) }));
      const future = withDates.filter((c) => !c.depDate || c.depDate >= now);

      // Normalfall: nur zukuenftige Verbindungen zeigen. Falls die HVV-Antwort ausnahmsweise
      // ausschliesslich bereits vergangene Zeiten liefert, lieber die naechstgelegenen zeigen
      // (mit Hinweis) statt eine leere Liste
      let upcoming = future.slice(0, 3);
      let allPast = false;
      if (upcoming.length === 0) {
        allPast = true;
        upcoming = withDates
          .slice()
          .sort((a, b) => (b.depDate || 0) - (a.depDate || 0))
          .slice(0, 3);
      }

      if (allPast) {
        const notice = document.createElement('div');
        notice.style.cssText = 'font-size:0.7rem; color:#B5533C; margin-bottom:6px;';
        notice.textContent = 'HVV liefert gerade nur kürzlich abgefahrene Verbindungen – bitte kurz erneut versuchen';
        listEl.innerHTML = '';
        listEl.appendChild(notice);
      }

      const itemsHtml = upcoming.map((c) => {
        const dep = c.depDate;
        const arr = parseGtiTime(c.arrivalRaw);
        const depStr = dep ? dep.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : (c.departureRaw || '?');
        const arrStr = arr ? arr.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : (c.arrivalRaw || '?');
        const lineStr = c.lines && c.lines.length > 0 ? c.lines.join(' → ') : '';
        return `
          <div class="hvv-item">
            <div class="hvv-line">${lineStr || 'Verbindung'}</div>
            <div class="hvv-destination">Poppenbüttel${c.changes > 0 ? ` · ${c.changes}x umsteigen` : ''}</div>
            <div class="hvv-time">ab ${depStr} → an ${arrStr}</div>
          </div>
        `;
      }).join('');
      listEl.innerHTML += itemsHtml;
    } catch (e) {
      console.error('Poppenbüttel Route Fehler:', e);
      listEl.innerHTML = '<div class="hvv-error">Route nicht erreichbar</div>';
    }
    const now = new Date();
    document.getElementById('hvvUpdate').textContent = `Aktualisiert: ${now.toLocaleTimeString('de-DE')}`;
  }

      } catch (e) {
        document.getElementById('shoppingCount').textContent = '0';
        previewEl.innerHTML = '';
      }
      
      // Was essen wir heute
      const mealData = await window.storage.get('household:todays-meal', true);
      if (mealData) {
        const meal = JSON.parse(mealData.value);
        const today = localDateKey(new Date());
        if (meal.date === today) {
          document.getElementById('todaysMeal').textContent = meal.text || '—';
        } else {
          document.getElementById('todaysMeal').textContent = '—';
        }
      } else {
        document.getElementById('todaysMeal').textContent = '—';
      }
      
      // Pinnwand (aus der Pinnwand-App: Speicherschlüssel "tasks", Felder title/status/category)
      const pinnwand = await window.storage.get('tasks', true);
      const pinnwandPreviewEl = document.getElementById('pinnwandPreview');
      if (pinnwand && pinnwand.value) {
        const pinnwandData = JSON.parse(pinnwand.value);
        const open = pinnwandData.filter((t) => t.status === 'offen');
        document.getElementById('householdTasks').textContent = open.length;

        const preview = open.slice().sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);
        if (preview.length === 0) {
          pinnwandPreviewEl.innerHTML = '';
        } else {
          const rest = open.length - preview.length;
          pinnwandPreviewEl.innerHTML =
            preview.map((t) => `• ${escapeHtml(t.title)}`).join('<br>') +
            (rest > 0 ? `<br><span class="more">+${rest} weitere</span>` : '');
        }
      } else {
        document.getElementById('householdTasks').textContent = '0';
        pinnwandPreviewEl.innerHTML = '';
      }
      
    } catch (e) {
      console.error('Actions update error:', e);
    }
  }

  // Click Handler für Meal, Tasks und HVV
  document.addEventListener('click', async (e) => {
    if (e.target.id === 'todaysMeal') {
      const input = await customPrompt('Was essen wir heute?', 'z.B. "Pasta Bolognese"');
      if (input !== null) {
        const today = localDateKey(new Date());
        await window.storage.set('household:todays-meal', JSON.stringify({ date: today, text: input }), true);
        document.getElementById('todaysMeal').textContent = input || '—';
      }
    }
    
    if (e.target.closest('#pinnwandCard')) {
      const taskInput = await customPrompt('Neue Notiz für die Pinnwand', 'z.B. "Küche putzen"');
      if (taskInput !== null && taskInput.trim()) {
        let tasksData = [];
        try {
          const existing = await window.storage.get('tasks', true);
          if (existing && existing.value) tasksData = JSON.parse(existing.value);
        } catch (e) {}
        
        tasksData.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          title: taskInput.trim(),
          category: 'Sonstiges',
          status: 'offen',
          createdAt: Date.now(),
        });
        
        await window.storage.set('tasks', JSON.stringify(tasksData), true);
        await updateActionsOverview();
      }
    }

    if (e.target.closest('#shoppingCard')) {
      const itemInput = await customPrompt('Was soll auf die Einkaufsliste?', 'Mehrere Artikel mit Komma trennen, z.B. "Milch, Eier, Butter"');
      if (itemInput !== null && itemInput.trim()) {
        const names = itemInput.split(',').map((n) => n.trim()).filter(Boolean);

        // Gleiche Listen-Struktur wie im Einkaufszettel: Liste "Einkaufsliste" gezielt verwenden, notfalls anlegen
        let lists = [];
        try {
          const existingLists = await window.storage.get('shoppingapp:lists', true);
          if (existingLists) lists = JSON.parse(existingLists.value);
        } catch (e) {}

        let einkaufsliste = lists.find((l) => l.name === 'Einkaufsliste');
        if (!einkaufsliste) {
          einkaufsliste = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
            name: 'Einkaufsliste',
            icon: '🛍️',
            color: '#3C6E8F',
            createdAt: Date.now(),
          };
          lists.push(einkaufsliste);
          await window.storage.set('shoppingapp:lists', JSON.stringify(lists), true);
        }
        const targetListId = einkaufsliste.id;

        let items = [];
        try {
          const existingItems = await window.storage.get('shoppingapp:items', true);
          if (existingItems) items = JSON.parse(existingItems.value);
        } catch (e) {}

        names.forEach((name) => {
          const already = items.find(
            (it) => it.listId === targetListId && !it.checked && it.n.toLowerCase() === name.toLowerCase()
          );
          if (!already) {
            items.push({
              id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
              listId: targetListId,
              n: name,
              c: 'sonstiges',
              i: '📝',
              checked: false,
              qty: 1,
              addedVia: 'dashboard',
            });
          }
        });

        await window.storage.set('shoppingapp:items', JSON.stringify(items), true);
        await updateActionsOverview();
      }
    }
  });

  // Initialisierung
  (async function init() {
    initRainViewer();
    await loadTemperature();
    await renderCalendar();
    await loadHVVData();
    await updateActionsOverview();
    
    // Auto-refresh alle 5 Minuten
    setInterval(async () => {
      await loadTemperature();
      await renderCalendar();
      await loadHVVData();
      await updateActionsOverview();
    }, 5 * 60 * 1000);
  })();
</script>
  <button id="refreshFab" class="refresh-fab" aria-label="Seite aktualisieren" title="Seite aktualisieren">⟳</button>
  <script>
    document.getElementById('refreshFab').addEventListener('click', function () {
      this.classList.add('spinning');
      setTimeout(() => location.reload(), 200);
    });
  </script>
</body>
