<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinnwand · Haushaltsaufgaben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#e7ede7;
    --board-dark:#d7e0d6;
    --card:#fffdf8;
    --ink:#2b2e29;
    --ink-soft:#5c625a;
    --teal:#3f6a63;
    --teal-dark:#2c4c47;
    --ochre:#c9803f;
    --ochre-soft:#f0dcc0;
    --sage:#6b8f71;
    --sage-soft:#dceadd;
    --pin:#c85a4a;
    --shadow: 0 10px 24px rgba(43,46,41,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.045) 1px, transparent 0) 0 0/22px 22px,
      var(--board);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
  }
  header h1{
    font-family:'Caveat', cursive;
    font-size:2.6rem;
    font-weight:700;
    margin:0;
    color:var(--teal-dark);
    transform:rotate(-1.5deg);
  }
  header p{
    margin:4px 0 0;
    font-size:0.85rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .stats{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .stat{
    background:var(--card);
    border-radius:10px;
    padding:8px 16px;
    box-shadow: var(--shadow);
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
  }
  .stat b{
    display:block;
    font-family:'Work Sans', sans-serif;
    font-size:1.3rem;
    color:var(--teal-dark);
    font-weight:700;
  }
  .toolbar{
    max-width:640px;
    margin:0 auto;
    padding:0 16px;
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px 12px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow: var(--shadow);
    transition:transform 0.12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-photo{background:var(--teal); color:#fff;}
  .btn-manual{background:var(--card); color:var(--teal-dark); border:2px solid var(--teal);}
  main{
    max-width:640px;
    margin:0 auto;
    padding:24px 16px 0;
  }
  .section-label{
    font-family:'Caveat', cursive;
    font-size:1.5rem;
    color:var(--teal-dark);
    margin:26px 4px 12px;
    font-weight:700;
  }
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:0.9rem;
  }
  .empty span{display:block; font-size:2rem; margin-bottom:8px;}
  .card{
    background:var(--card);
    border-radius:4px;
    box-shadow: var(--shadow);
    padding:16px;
    margin-bottom:16px;
    position:relative;
  }
  .card.polaroid{
    transform:rotate(var(--rot,-0.8deg));
  }
  .card::before{
    content:'';
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:38px;
    height:16px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(0,0,0,0.06);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-title{
    font-weight:600;
    font-size:1.02rem;
    margin:0 0 2px;
  }
  .card-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
  }
  .badge{
    font-size:0.68rem;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.offen{background:var(--ochre-soft); color:var(--ochre);}
  .badge.erledigt{background:var(--sage-soft); color:var(--sage);}
  .photos{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .photo-box{
    flex:1;
    text-align:center;
  }
  .photo-box img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:3px;
    border:1px solid rgba(0,0,0,0.08);
  }
  .photo-box .ph-label{
    font-family:'JetBrains Mono', monospace;
    font-size:0.62rem;
    color:var(--ink-soft);
    margin-top:4px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .photo-placeholder{
    aspect-ratio:1;
    border:1.5px dashed rgba(0,0,0,0.18);
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(0,0,0,0.28);
    font-size:1.4rem;
  }
  .card-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .mini-btn{
    flex:1;
    border:none;
    border-radius:8px;
    padding:9px;
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
  }
  .mini-btn.done{background:var(--teal); color:#fff;}
  .mini-btn.after{background:var(--ochre-soft); color:var(--ochre);}
  .mini-btn.del{background:transparent; color:var(--pin); border:1px solid rgba(200,90,74,0.3);}

  .overlay{
    position:fixed; inset:0;
    background:rgba(43,46,41,0.5);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:22px 20px 28px;
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:'Caveat', cursive;
    font-size:1.7rem;
    color:var(--teal-dark);
    margin:0 0 14px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:0.75rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .field input[type=text], .field select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1.5px solid rgba(0,0,0,0.12);
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    background:#fff;
  }
  .photo-input-area{
    border:2px dashed rgba(0,0,0,0.18);
    border-radius:12px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .photo-input-area img{
    width:100%;
    max-height:200px;
    object-fit:cover;
    border-radius:8px;
  }
  .photo-input-area .hint{
    color:var(--ink-soft);
    font-size:0.85rem;
  }
  .photo-input-area input{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .sheet-actions .btn{flex:1; box-shadow:none;}
  .btn-cancel{background:transparent; color:var(--ink-soft); border:1.5px solid rgba(0,0,0,0.15);}
  .btn-save{background:var(--teal); color:#fff;}
  .loading{
    text-align:center;
    padding:30px;
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem;
  }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--teal-dark);
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:0.85rem;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:100;
    box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;}
  .reset-link{
    display:block;
    text-align:center;
    margin-top:30px;
    color:var(--ink-soft);
    font-size:0.72rem;
    text-decoration:underline;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Die Pinnwand</h1>
  <p>Haushaltsaufgaben mit Foto festhalten</p>
  <div class="stats">
    <div class="stat"><b id="statOpen">0</b>offen</div>
    <div class="stat"><b id="statDone">0</b>erledigt</div>
  </div>
</header>

<div class="toolbar">
  <button class="btn btn-photo" id="btnPhotoTask">📷 Foto aufnehmen</button>
  <button class="btn btn-manual" id="btnManualTask">✎ Manuell eintragen</button>
</div>

<main>
  <div class="section-label">Zu erledigen</div>
  <div id="listOpen"></div>

  <div class="section-label">Erledigt</div>
  <div id="listDone"></div>
</main>

<span class="reset-link" id="resetLink">Alle Aufgaben zurücksetzen</span>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = ["Küche","Bad","Wohnzimmer","Garten","Sonstiges"];
let tasks = [];
let pendingPhoto = null;

const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

function closeSheet(){
  overlay.classList.remove('show');
  sheet.innerHTML = '';
  pendingPhoto = null;
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 700;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*maxDim/w; w = maxDim; }
        else if(h > maxDim){ w = w*maxDim/h; h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadTasks(){
  document.getElementById('listOpen').innerHTML = '<div class="loading">Lade Aufgaben …</div>';
  try{
    const result = await window.storage.get('tasks', true);
    tasks = result && result.value ? JSON.parse(result.value) : [];
  }catch(err){
    tasks = [];
  }
  render();
}

async function saveTasks(){
  try{
    const result = await window.storage.set('tasks', JSON.stringify(tasks), true);
    if(!result){ showToast('Speichern fehlgeschlagen'); }
  }catch(err){
    showToast('Speichern fehlgeschlagen');
  }
}

function render(){
  const open = tasks.filter(t=>t.status==='offen').sort((a,b)=>b.createdAt-a.createdAt);
  const done = tasks.filter(t=>t.status==='erledigt').sort((a,b)=>b.createdAt-a.createdAt);
  document.getElementById('statOpen').textContent = open.length;
  document.getElementById('statDone').textContent = done.length;

  const openEl = document.getElementById('listOpen');
  const doneEl = document.getElementById('listDone');

  openEl.innerHTML = open.length ? open.map(cardHtml).join('') :
    '<div class="empty"><span>🧹</span>Gerade nichts zu tun. Neue Aufgabe hinzufügen?</div>';
  doneEl.innerHTML = done.length ? done.map(cardHtml).join('') :
    '<div class="empty"><span>✅</span>Noch keine Aufgabe erledigt.</div>';

  document.querySelectorAll('[data-done]').forEach(b=>b.onclick = ()=>markDone(b.dataset.done));
  document.querySelectorAll('[data-after]').forEach(b=>b.onclick = ()=>openAfterPhoto(b.dataset.after));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick = ()=>deleteTask(b.dataset.del));
}

function cardHtml(t){
  const rot = (t.id.charCodeAt(0)%2===0? 1:-1) * (0.4 + (t.id.charCodeAt(1)%5)/10);
  const date = new Date(t.createdAt).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});
  return `
  <div class="card polaroid" style="--rot:${rot}deg">
    <div class="card-top">
      <div>
        <p class="card-title">${escapeHtml(t.title)}</p>
        <p class="card-meta">${t.category} · ${date}</p>
      </div>
      <span class="badge ${t.status}">${t.status}</span>
    </div>
    ${(t.photoBefore || t.photoAfter) ? `
    <div class="photos">
      <div class="photo-box">
        ${t.photoBefore ? `<img src="${t.photoBefore}">` : `<div class="photo-placeholder">–</div>`}
        <div class="ph-label">Vorher</div>
      </div>
      <div class="photo-box">
        ${t.photoAfter ? `<img src="${t.photoAfter}">` : `<div class="photo-placeholder">–</div>`}
        <div class="ph-label">Nachher</div>
      </div>
    </div>` : ''}
    <div class="card-actions">
      ${t.status==='offen' ? `<button class="mini-btn done" data-done="${t.id}">Als erledigt markieren</button>` : ''}
      ${t.status==='erledigt' && !t.photoAfter ? `<button class="mini-btn after" data-after="${t.id}">Nachher Foto</button>` : ''}
      <button class="mini-btn del" data-del="${t.id}">Löschen</button>
    </div>
  </div>`;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function markDone(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = 'erledigt';
  t.doneAt = Date.now();
  render();
  await saveTasks();
  showToast('Aufgabe erledigt');
}

async function deleteTask(id){
  tasks = tasks.filter(x=>x.id!==id);
  render();
  await saveTasks();
  showToast('Aufgabe gelöscht');
}

function openAfterPhoto(id){
  sheet.innerHTML = `
    <h2>Nachher Foto hinzufügen</h2>
    <div class="field">
      <div class="photo-input-area" id="afterPhotoArea">
        <p class="hint">Tippen um ein Foto aufzunehmen oder auszuwählen</p>
        <input type="file" accept="image/*" capture="environment" id="afterPhotoInput">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="cancelAfter">Abbrechen</button>
      <button class="btn btn-save" id="saveAfter">Speichern</button>
    </div>
  `;
  overlay.classList.add('show');
  let photoData = null;
  document.getElementById('afterPhotoInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    photoData = await compressImage(file);
    document.getElementById('afterPhotoArea').innerHTML = `<img src="${photoData}">`;
  };
  document.getElementById('cancelAfter').onclick = closeSheet;
  document.getElementById('saveAfter').onclick = async ()=>{
    const t = tasks.find(x=>x.id===id);
    if(t && photoData) t.photoAfter = photoData;
    closeSheet();
    render();
    await saveTasks();
    showToast('Foto gespeichert');
  };
}

function openTaskForm(withPhoto){
  sheet.innerHTML = `
    <h2>${withPhoto ? 'Aufgabe mit Foto' : 'Neue Aufgabe'}</h2>
    ${withPhoto ? `
    <div class="field">
      <label>Vorher Foto</label>
      <div class="photo-input-area" id="photoArea">
        <p class="hint">Tippen um ein Foto aufzunehmen</p>
        <input type="file" accept="image/*" capture="environment" id="photoInput">
      </div>
    </div>` : ''}
    <div class="field">
      <label>Titel</label>
      <input type="text" id="taskTitle" placeholder="z. B. Geschirrspüler ausräumen">
    </div>
    <div class="field">
      <label>Bereich</label>
      <select id="taskCategory">
        ${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
      </select>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="cancelTask">Abbrechen</button>
      <button class="btn btn-save" id="saveTask">Aufgabe anlegen</button>
    </div>
  `;
  overlay.classList.add('show');

  if(withPhoto){
    document.getElementById('photoInput').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      pendingPhoto = await compressImage(file);
      document.getElementById('photoArea').innerHTML = `<img src="${pendingPhoto}">`;
    };
  }

  document.getElementById('cancelTask').onclick = closeSheet;
  document.getElementById('saveTask').onclick = async ()=>{
    const title = document.getElementById('taskTitle').value.trim();
    if(!title){ showToast('Bitte einen Titel eingeben'); return; }
    const category = document.getElementById('taskCategory').value;
    const newTask = {
      id: 't' + Date.now() + Math.random().toString(36).slice(2,7),
      title, category,
      status: 'offen',
      createdAt: Date.now(),
      photoBefore: pendingPhoto || null,
      photoAfter: null
    };
    tasks.push(newTask);
    closeSheet();
    render();
    await saveTasks();
    showToast('Aufgabe angelegt');
  };
}

document.getElementById('btnPhotoTask').onclick = ()=>openTaskForm(true);
document.getElementById('btnManualTask').onclick = ()=>openTaskForm(false);
overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(); };

document.getElementById('resetLink').onclick = async ()=>{
  if(!confirm('Wirklich alle Aufgaben löschen?')) return;
  tasks = [];
  render();
  await saveTasks();
  showToast('Zurückgesetzt');
};

loadTasks();
</script>
</body>
</html>
