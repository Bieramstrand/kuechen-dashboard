  <title>U-Bahn live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --paper: #FBF8F1;
      --ink: #2A2417;
      --muted: #8A8069;
      --rule: #E4DCC5;
      --line: #1B64B0;
      --live: #3F8F4F;
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px;
      border-bottom: 1px solid var(--rule);
    }
    .sign {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background: var(--line);
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: 1.35rem;
      line-height: 1.15;
      margin: 0;
    }
    #status { margin: 3px 0 0; font-size: 0.8rem; color: var(--muted); }
    #status.error { color: #B5533C; }
    .back {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--line);
      text-decoration: none;
      padding: 8px 12px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: #fff;
    }
    .back:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; }

    /* Linienauswahl */
    .chips {
      display: flex;
      gap: 8px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--rule);
      overflow-x: auto;
    }
    .chip {
      flex-shrink: 0;
      min-height: 40px;
      min-width: 52px;
      padding: 0 16px;
      border-radius: 20px;
      border: 2px solid var(--c, var(--ink));
      background: #fff;
      color: var(--c, var(--ink));
      font: 800 0.9rem 'Inter', sans-serif;
      cursor: pointer;
    }
    .chip.active { background: var(--c, var(--ink)); color: var(--t, #fff); }
    .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    #map { flex: 1; min-height: 0; background: #EDEBE6; }
    .note {
      margin: 0;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 8px 18px;
      padding: 8px 18px calc(8px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--rule);
    }
    .note .ring {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 2px solid var(--live);
      vertical-align: -1px;
      margin: 0 2px;
    }

    /* Karte in Grautoenen, damit nur die Linienfarben tragen */
    .leaflet-tile-pane { filter: grayscale(1) contrast(0.92) brightness(1.05); }

    /* Zuege */
    .train-icon { background: none; border: none; }
    .train {
      position: relative;
      width: 46px;
      height: 34px;
    }
    .train .tsvg {
      position: absolute;
      left: 0;
      top: 1px;
      filter: drop-shadow(0 1px 2px rgba(42, 36, 23, 0.5));
    }
    .train .badge {
      position: absolute;
      right: 0;
      bottom: 0;
      min-width: 22px;
      height: 16px;
      padding: 0 3px;
      box-sizing: border-box;
      border-radius: 4px;
      border: 2px solid #fff;
      background: var(--lc);
      color: var(--lt);
      font: 800 10px/12px 'Inter', sans-serif;
      text-align: center;
      box-shadow: 0 1px 3px rgba(42, 36, 23, 0.4);
    }
    .train.live .badge { border-color: var(--live); }
    .train-dir {
      position: absolute;
      left: 0;
      top: 1px;
      width: 28px;
      height: 32px;
      pointer-events: none;
    }
    .train-dir::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 8px solid var(--lc);
      filter: drop-shadow(0 0 1px #fff);
    }

    /* Haltestellen */
    .station-label {
      background: rgba(251, 248, 241, 0.92);
      border: none;
      box-shadow: none;
      border-radius: 4px;
      padding: 1px 5px;
      font: 600 11px 'Inter', sans-serif;
      color: var(--ink);
    }
    .station-label::before { display: none; }
    .station-label.home { font-weight: 800; color: var(--line); }
    #map.hide-labels .station-label:not(.home) { display: none; }

    .home-pin {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-sizing: border-box;
    }

    .leaflet-popup-content { font: 13px/1.45 'Inter', sans-serif; color: var(--ink); margin: 12px 14px; }
    .pop-title { font-weight: 800; font-size: 14px; margin-bottom: 2px; }
    .pop-meta { color: var(--muted); margin-top: 4px; }
    .pop-meta.late { color: #B5533C; font-weight: 600; }

    @media (max-width: 520px) {
      h1 { font-size: 1.1rem; }
      .sign { width: 38px; height: 38px; font-size: 1rem; }
      .back { padding: 7px 10px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="sign" id="sign" aria-hidden="true">U1</div>
    <div>
      <h1 id="title">U1 rund um Garstedt</h1>
      <p id="status">Züge werden geladen</p>
    </div>
    <a class="back" href="/">Dashboard</a>
  </header>

  <nav class="chips" id="chips" aria-label="Linie wählen"></nav>

  <main id="map" aria-label="Karte der U Bahn mit fahrenden Zügen"></main>

  <p class="note">Positionen sind aus Fahrplan und Echtzeitdaten von Geofox berechnet, keine GPS Ortung. Ein grüner Rand am Linienschild <span class="ring" aria-hidden="true"></span> zeigt Fahrten mit Echtzeitdaten. Zug antippen für Ziel und Verspätung.</p>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (function () {
    const FN_URL = '/.netlify/functions/hvv-vehicles';
    const POLL_MS = 60 * 1000;        // Geofox erlaubt im Schnitt hoechstens 1 Aufruf pro Sekunde
    const TICK_MS = 500;              // Positionen zwischen den Abfragen selbst weiterbewegen
    const AFTER_ARRIVAL_MS = 30 * 1000;
    const HOME = [53.683943, 9.979259];
    const CACHE_TRACKS = 'ubahnlive:v2:tracks';
    const CACHE_STATIONS = 'ubahnlive:v2:stations';
    const CACHE_ACTIVE = 'ubahnlive:v2:active';
    const DEFAULT_BOUNDS = [[53.623, 9.965], [53.712, 10.04]];
    const LINES = {
      U1: { color: '#1B64B0', text: '#fff' },
      U2: { color: '#E2001A', text: '#fff' },
      U3: { color: '#F5C400', text: '#2A2417' },
      U4: { color: '#00A0A0', text: '#fff' },
    };
    const TRAIN_SVG = '<svg class="tsvg" viewBox="0 0 28 32" width="28" height="32" aria-hidden="true"><rect x="2" y="1.5" width="24" height="29" rx="8" fill="#F3F3F0" stroke="#C8102E" stroke-width="2.6"/><rect x="6" y="5" width="16" height="4" rx="1.2" fill="#1E2430"/><rect x="8" y="6.2" width="12" height="1.7" rx=".8" fill="#F29A1F"/><rect x="6" y="11" width="16" height="9" rx="2.5" fill="#1E2430"/><circle cx="8.6" cy="24.5" r="1.7" fill="#FFF3B0" stroke="#8A8069" stroke-width=".5"/><circle cx="19.4" cy="24.5" r="1.7" fill="#FFF3B0" stroke="#8A8069" stroke-width=".5"/><rect x="9" y="27.2" width="10" height="1.3" rx=".6" fill="#8A8069"/></svg>';

    const map = L.map('map', { zoomControl: true });
    map.fitBounds(DEFAULT_BOUNDS);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap',
    }).addTo(map);

    const trackLayer = L.layerGroup().addTo(map);
    const stationLayer = L.layerGroup().addTo(map);
    const trainLayer = L.layerGroup().addTo(map);

    L.marker(HOME, {
      icon: L.divIcon({ className: 'train-icon', html: '<div class="home-pin">🏠</div>', iconSize: [26, 26], iconAnchor: [13, 13] }),
      keyboard: false,
    }).bindTooltip('Zuhause', { direction: 'top', offset: [0, -12] }).addTo(map);

    const statusEl = document.getElementById('status');
    const mapEl = document.getElementById('map');
    const markers = new Map();
    let journeys = [];
    let clockOffset = 0;
    let lastUpdate = null;
    let errorText = '';

    // ---------- kleine Helfer ----------
    function load(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function hhmm(ms) { return new Date(ms).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
    function now() { return Date.now() + clockOffset; }
    function lineOf(j) {
      const l = String(j.line || 'U1').toUpperCase().replace(/\s+/g, '');
      return LINES[l] ? l : null;
    }

    // POSITION_LOGIC_START
    // Abstand in Metern (fuer kurze Strecken genau genug)
    function distM(a, b) {
      const dy = (a[0] - b[0]) * 111320;
      const dx = (a[1] - b[1]) * 111320 * Math.cos(a[0] * Math.PI / 180);
      return Math.hypot(dx, dy);
    }
    // Punkt bei Anteil f (0 bis 1) entlang eines Gleisverlaufs
    function alongPolyline(pts, f) {
      if (pts.length === 1) return pts[0];
      const lens = [];
      let total = 0;
      for (let i = 1; i < pts.length; i++) { const d = distM(pts[i - 1], pts[i]); lens.push(d); total += d; }
      let target = Math.max(0, Math.min(1, f)) * total;
      for (let i = 0; i < lens.length; i++) {
        if (target <= lens[i] || i === lens.length - 1) {
          const r = lens[i] ? Math.min(1, target / lens[i]) : 0;
          return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * r, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * r];
        }
        target -= lens[i];
      }
      return pts[pts.length - 1];
    }
    // Fahrtrichtung in Grad (0 = Norden, 90 = Osten) eines Abschnitts
    function bearing(pts) {
      const a = pts[0], b = pts[pts.length - 1];
      const dy = b[0] - a[0];
      const dx = (b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180);
      return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
    }
    // Wo ist die Fahrt zum Zeitpunkt t? null = gerade nicht im Ausschnitt unterwegs
    function positionAt(j, t, afterArrivalMs) {
      const segs = j.segments;
      if (!segs || !segs.length) return null;
      const first = segs[0], last = segs[segs.length - 1];
      if (t < first.start) return null;
      if (t > last.end + afterArrivalMs) return null;
      for (let i = 0; i < segs.length; i++) {
        const s = segs[i];
        if (t < s.start) return { ll: s.track[0], halt: true, station: s.from, seg: s, deg: bearing(s.track) };
        if (t <= s.end) {
          const f = (t - s.start) / Math.max(1, s.end - s.start);
          return { ll: alongPolyline(s.track, f), halt: false, seg: s, deg: bearing(s.track) };
        }
      }
      return { ll: last.track[last.track.length - 1], halt: true, arrived: true, station: last.to, seg: last, deg: bearing(last.track) };
    }
    // Verspaetung: Geofox liefert je nach Methode Minuten oder Sekunden
    function delayMinutes(v) { const n = Number(v) || 0; return n > 60 ? Math.round(n / 60) : n; }
    // POSITION_LOGIC_END

    // ---------- Linienauswahl ----------
    let active = load(CACHE_ACTIVE);
    if (active !== 'ALL' && !LINES[active]) active = 'U1';
    function isActive(line) { return active === 'ALL' || active === line; }

    const chipsEl = document.getElementById('chips');
    function buildChips() {
      chipsEl.innerHTML = '';
      const defs = [['ALL', 'Alle Linien', '#2A2417', '#fff']].concat(Object.keys(LINES).map((k) => [k, k, LINES[k].color, LINES[k].text]));
      defs.forEach(([key, label, c, t]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip' + (active === key ? ' active' : '');
        b.textContent = label;
        b.style.setProperty('--c', c);
        b.style.setProperty('--t', t);
        b.setAttribute('aria-pressed', active === key ? 'true' : 'false');
        b.addEventListener('click', () => setActive(key));
        chipsEl.appendChild(b);
      });
    }
    function updateHeader() {
      const sign = document.getElementById('sign');
      const title = document.getElementById('title');
      if (active === 'ALL') {
        sign.textContent = 'U';
        sign.style.background = '#2A2417';
        sign.style.color = '#fff';
        title.textContent = 'U Bahn live';
        document.title = 'U Bahn live';
      } else {
        sign.textContent = active;
        sign.style.background = LINES[active].color;
        sign.style.color = LINES[active].text;
        title.textContent = active === 'U1' ? 'U1 rund um Garstedt' : active + ' live';
        document.title = title.textContent;
      }
    }
    function fitToActive() {
      const pts = [];
      Object.values(trackCache).forEach((t) => { if (isActive(t.line)) t.pts.forEach((p) => pts.push(p)); });
      if (pts.length > 1) map.fitBounds(L.latLngBounds(pts), { padding: [20, 20] });
      else map.fitBounds(DEFAULT_BOUNDS);
    }
    function setActive(key) {
      active = key;
      save(CACHE_ACTIVE, active);
      buildChips();
      updateHeader();
      drawNetwork();
      fitToActive();
      tick();
    }

    // ---------- Strecke und Haltestellen ----------
    let trackCache = load(CACHE_TRACKS) || {};
    let stationCache = load(CACHE_STATIONS) || {};

    function drawNetwork() {
      trackLayer.clearLayers();
      Object.values(trackCache).forEach((t) => {
        if (!isActive(t.line) || !LINES[t.line]) return;
        L.polyline(t.pts, { color: '#fff', weight: 9, opacity: 0.9, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(trackLayer);
        L.polyline(t.pts, { color: LINES[t.line].color, weight: 5, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(trackLayer);
      });
      stationLayer.clearLayers();
      Object.keys(stationCache).forEach((name) => {
        const st = stationCache[name];
        const lines = (st.lines || []).filter(isActive);
        if (!lines.length) return;
        const isHome = /garstedt/i.test(name);
        const col = lines.length > 1 ? '#2A2417' : LINES[lines[0]].color;
        L.circleMarker(st.ll, { radius: isHome ? 7 : 5, color: col, weight: 3, fillColor: '#fff', fillOpacity: 1, interactive: false })
          .bindTooltip(esc(name), { permanent: true, direction: 'right', offset: [8, 0], className: 'station-label' + (isHome ? ' home' : '') })
          .addTo(stationLayer);
      });
    }

    function learnNetwork() {
      let changed = false;
      journeys.forEach((j) => {
        const line = lineOf(j);
        if (!line) return;
        j.segments.forEach((s) => {
          const key = line + '|' + [s.from, s.to].sort().join('|');
          if (!trackCache[key] || trackCache[key].pts.length < s.track.length) { trackCache[key] = { line, pts: s.track }; changed = true; }
          [[s.from, s.track[0]], [s.to, s.track[s.track.length - 1]]].forEach(([name, ll]) => {
            if (!name) return;
            const st = stationCache[name];
            if (!st) { stationCache[name] = { ll, lines: [line] }; changed = true; }
            else if (st.lines.indexOf(line) < 0) { st.lines.push(line); changed = true; }
          });
        });
      });
      if (changed) {
        save(CACHE_TRACKS, trackCache);
        save(CACHE_STATIONS, stationCache);
        drawNetwork();
      }
    }

    function updateLabelVisibility() {
      mapEl.classList.toggle('hide-labels', active === 'ALL' && map.getZoom() < 13);
    }
    map.on('zoomend', updateLabelVisibility);

    // ---------- Zuege ----------
    function trainHtml(j, line, deg) {
      const c = LINES[line];
      return '<div class="train' + (j.realtime ? ' live' : '') + '" style="--lc:' + c.color + ';--lt:' + c.text + '">' +
        TRAIN_SVG +
        '<div class="train-dir" style="transform: rotate(' + Math.round(deg) + 'deg)"></div>' +
        '<div class="badge">' + line + '</div></div>';
    }

    function popupHtml(j, line, p) {
      const s = p.seg;
      let where, when;
      if (p.arrived) {
        where = 'Angekommen in ' + esc(p.station);
        when = 'Ankunft ' + hhmm(s.end);
      } else if (p.halt) {
        where = 'Hält in ' + esc(p.station);
        when = 'Abfahrt ' + hhmm(s.start);
      } else {
        where = 'Fährt von ' + esc(s.from) + ' nach ' + esc(s.to);
        when = 'Ankunft ' + esc(s.to) + ' ' + hhmm(s.end);
      }
      let meta, late = false;
      if (!j.realtime) {
        meta = 'Fahrplandaten ohne Echtzeit';
      } else {
        const d = delayMinutes(s.delay);
        late = d > 0;
        meta = late ? d + ' Min. Verspätung' : 'pünktlich';
      }
      return '<div class="pop-title">' + line + ' nach ' + esc(j.destination || 'unbekannt') + '</div>' +
        '<div>' + where + '</div><div>' + when + '</div>' +
        '<div class="pop-meta' + (late ? ' late' : '') + '">' + meta + '</div>';
    }

    function updateStatus(count) {
      if (errorText) {
        statusEl.textContent = errorText;
        statusEl.className = 'error';
        return;
      }
      statusEl.className = '';
      if (!lastUpdate) { statusEl.textContent = 'Züge werden geladen'; return; }
      const stand = 'Stand ' + lastUpdate.toLocaleTimeString('de-DE');
      const what = active === 'ALL' ? 'U Bahn' : active;
      if (count === 0) statusEl.textContent = 'Gerade keine ' + what + ' im Ausschnitt unterwegs. ' + stand;
      else statusEl.textContent = (count === 1 ? '1 Zug' : count + ' Züge') + ' im Ausschnitt. ' + stand;
    }

    function tick() {
      const t = now();
      const seen = new Set();
      let count = 0;
      journeys.forEach((j) => {
        const line = lineOf(j);
        if (!line || !isActive(line)) return;
        const p = positionAt(j, t, AFTER_ARRIVAL_MS);
        if (!p) return;
        count++;
        seen.add(j.id);
        let m = markers.get(j.id);
        if (!m) {
          m = L.marker(p.ll, {
            icon: L.divIcon({ className: 'train-icon', html: trainHtml(j, line, p.deg), iconSize: [46, 34], iconAnchor: [14, 17] }),
            title: line + ' nach ' + (j.destination || ''),
            riseOnHover: true,
          }).addTo(trainLayer);
          m.bindPopup('');
          m.on('popupopen', () => { if (m._u) m.setPopupContent(popupHtml(m._u.j, m._u.line, m._u.p)); });
          markers.set(j.id, m);
        } else {
          m.setLatLng(p.ll);
          const el = m.getElement();
          const dir = el && el.querySelector('.train-dir');
          if (dir) dir.style.transform = 'rotate(' + Math.round(p.deg) + 'deg)';
        }
        m._u = { j, line, p };
        if (m.isPopupOpen()) m.setPopupContent(popupHtml(j, line, p));
      });
      for (const [id, m] of markers) {
        if (!seen.has(id)) { trainLayer.removeLayer(m); markers.delete(id); }
      }
      updateStatus(count);
    }

    async function refresh() {
      try {
        const res = await fetch(FN_URL + '?_=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'unbekannter Fehler');
        clockOffset = (data.serverNow || Date.now()) - Date.now();
        journeys = data.journeys || [];
        learnNetwork();
        lastUpdate = new Date();
        errorText = '';
      } catch (e) {
        errorText = 'Fahrtdaten gerade nicht erreichbar (' + e.message + '). Neuer Versuch in einer Minute.';
      }
      tick();
    }

    buildChips();
    updateHeader();
    drawNetwork();
    fitToActive();
    updateLabelVisibility();
    refresh();
    setInterval(() => { if (document.visibilityState !== 'hidden') refresh(); }, POLL_MS);
    setInterval(() => { if (document.visibilityState !== 'hidden') tick(); }, TICK_MS);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
  })();
  </script>
</body>
</html>
